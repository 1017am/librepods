name: Apply patch and build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: mine}
      - uses: actions/checkout@v4
        with: {repository: kavishdevar/librepods, ref: v1.0.4, path: src}
      - name: Apply patch
        working-directory: src
        run: |
          git config user.name b; git config user.email b@b
          git am ../mine/*.patch
      - uses: actions/setup-java@v4
        with: {distribution: zulu, java-version: 21}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "ndk;30.0.14904198" "cmake;3.22.1"
      - name: Build APK
        working-directory: src/android
        run: ./gradlew --no-daemon :app:testFossDebugUnitTest :app:assembleFossDebug
      - uses: actions/upload-artifact@v4
        with: {name: librepods-apk, path: src/android/app/build/outputs/apk/foss/debug/*.apk}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: build-reports, path: src/android/app/build/reports/}
