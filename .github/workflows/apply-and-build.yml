# 저장 위치: 내 Fork 저장소의 .github/workflows/apply-and-build.yml
# 하는 일: 원본 LibrePods v1.0.4 소스를 받아 → 저장소에 올린 .patch 파일을 적용 → APK 빌드 → 다운로드 파일로 첨부
name: Apply patch and build APK

on:
  workflow_dispatch:   # Actions 탭의 "Run workflow" 버튼으로 실행

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Get my repo (patch file)
        uses: actions/checkout@v4
        with:
          path: mine

      - name: Get original LibrePods v1.0.4
        uses: actions/checkout@v4
        with:
          repository: kavishdevar/librepods
          ref: v1.0.4
          path: src

      - name: Apply patch
        working-directory: src
        run: |
          git config user.name "fork-builder"
          git config user.email "fork-builder@users.noreply.github.com"
          PATCH=$(ls ../mine/*.patch | head -n 1)
          echo "Applying $PATCH"
          git am "$PATCH" || { git am --abort; git apply --3way "$PATCH"; }

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install SDK 37, NDK, CMake
  
